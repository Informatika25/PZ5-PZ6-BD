{% extends 'base.html' %}

{% block title %}
Профиль
{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">

        <h1 class="mb-3">
            Профиль
        </h1>

        <p>
            Пользователь:
            <strong>{{ request.user.username }}</strong>
        </p>

        {% if is_methodist %}
            <span class="badge text-bg-success">
                Методист
            </span>
        {% endif %}

        <div class="mt-3">
            <a class="btn btn-primary"
               href="/courses/">
                Курсы
            </a>
        </div>

    </div>
</div>

{% endblock %}
